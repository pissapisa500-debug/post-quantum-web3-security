[package]
name = "post-quantum-web3-security"
version = "0.1.0"
edition = "2021"

[dependencies]
# Гибридные подписи Ed25519 + Falcon
falconed = "0.1.0"

# CLI парсер
clap = { version = "4.5", features = ["derive", "std"] }

# Кодирование hex
hex = "0.4"

# Случайные числа
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
opt-level = 3
lto = true
