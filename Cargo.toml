[package]
name = "post-quantum-web3-security"
version = "0.1.0"
edition = "2021"
description = "Post-Quantum Web3 Security — hybrid signatures (ed25519 + Falcon-512) for Solana, Aptos, and Ethereum"
license = "MIT"
authors = ["pissapisa500-debug"]
repository = "https://github.com/pissapisa500-debug/post-quantum-web3-security"
keywords = ["cryptography", "post-quantum", "solana", "aptos", "falcon", "web3"]
categories = ["cryptography", "development-tools"]

[dependencies]
falconed = "0.1.0"
clap = { version = "4.5", features = ["derive", "std"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.0"

[profile.release]
opt-level = 3
lto = true